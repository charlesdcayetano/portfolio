    <style>
      @font-face {
        font-family: 'Geist Pixel';
        src: url('https://cdn.jsdelivr.net/gh/vercel/geist-pixel-font@main/fonts/webfonts/GeistPixel-Square.woff2') format('woff2');
        font-display: swap;
      }

      :root {
        --bg: 255 255 255;
        --ink: 10 10 10;
        --g50: 250 250 250;  --g100: 245 245 245; --g200: 233 233 233; --g300: 212 212 212;
        --g400: 163 163 163; --g500: 115 115 115; --g600: 82 82 82;   --g700: 64 64 64;
        --g800: 38 38 38;    --g900: 23 23 23;    --g950: 10 10 10;
        --halftone: rgba(10, 10, 10, 0.88);
        --sel-bg: #0a0a0a; --sel-fg: #ffffff;
      }

      html.dark {
        --bg: 12 12 15;
        --ink: 244 244 245;
        --g50: 24 24 27;     --g100: 30 30 34;    --g200: 42 42 48;   --g300: 58 58 66;
        --g400: 138 138 146; --g500: 160 160 168; --g600: 184 184 192; --g700: 206 206 212;
        --g800: 228 228 232; --g900: 240 240 243; --g950: 250 250 250;
        --halftone: rgba(244, 244, 245, 0.38);
        --sel-bg: #fafafa; --sel-fg: #0a0a0a;
        color-scheme: dark;
      }

      html { background-color: rgb(var(--bg)); }
      body { background-color: rgb(var(--bg)); color: rgb(var(--ink)); }
      ::-moz-selection { background: var(--sel-bg); color: var(--sel-fg); }
      ::selection { background: var(--sel-bg); color: var(--sel-fg); }

      /* Coordinated crossfade during theme change */
      html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
        transition: background-color .45s ease, border-color .45s ease, color .45s ease,
                    fill .45s ease, stroke .45s ease, box-shadow .45s ease, outline-color .45s ease !important;
      }
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
    </style>

    <script>
      (function () {
        const KEY = 'charles_portfolio_theme';
        const root = document.documentElement;
        const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function pref() {
          try {
            const v = localStorage.getItem(KEY);
            return (v === 'dark' || v === 'light' || v === 'system') ? v : 'dark';
          } catch (e) {
            return 'dark';
          }
        }
        function isDark(p) {
          return p === 'dark' || (p === 'system' && !!mq && mq.matches);
        }
        function setClass(p) {
          root.classList.toggle('dark', isDark(p));
        }
        setClass(pref());
        if (mq) mq.addEventListener('change', function () { if (pref() === 'system') setClass('system'); });
      })();
    </script>
